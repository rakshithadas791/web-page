<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Cakes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="featured-cakes.html">Featured Cakes</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="cakes-section">
        <h1>Our Featured Cakes 🍰</h1>
        <div class="cake-container">
            <div class="cake">
                <img src="chocolate-cake.jpg" alt="Chocolate Cake">
                <h2>Chocolate Delight</h2>
                <p>Rich and creamy chocolate cake topped with ganache.</p>
                <button onclick="orderCake('Chocolate Delight')">Order Now</button>
            </div>
            <div class="cake">
                <img src="strawberry-cake.jpg" alt="Strawberry Cake">
                <h2>Strawberry Bliss</h2>
                <p>Fresh strawberries blended into a soft sponge cake.</p>
                <button onclick="orderCake('Strawberry Bliss')">Order Now</button>
            </div>
            <div class="cake">
                <img src="vanilla-cake.jpg" alt="Vanilla Cake">
                <h2>Classic Vanilla</h2>
                <p>A timeless vanilla sponge cake with buttercream frosting.</p>
                <button onclick="orderCake('Classic Vanilla')">Order Now</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
